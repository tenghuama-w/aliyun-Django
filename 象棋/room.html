    function isMyPiece(x, y) {
      return board[x][y] !== 0 && ((board[x][y] > 0) === iAmRed);
    }

    function clearSel() {
      selX = -1;
      selY = -1;
      selMoves = [];
      renderBoard();
    }

    function selectPiece(x, y) {
      const mv = legalMoves(x, y);
      selX = x;
      selY = y;
      selMoves = mv;
      renderBoard();
    }

    canvas.addEventListener('click', function (e) {
      if (roomStatus !== 'playing' || winner) return;
      if (currentTurn !== nickname) return;
      if (undoPendingBy) return;
      if (animBusy()) return;
      if (!wsReady()) return;

      const rect = canvas.getBoundingClientRect();
      const vx = Math.round((e.clientX - rect.left - PAD_X) / CELL);
      const vy = Math.round((e.clientY - rect.top - PAD_Y) / CELL);
      if (vx < 0 || vx >= BOARD_W || vy < 0 || vy >= BOARD_H) {
        clearSel();
        return;
      }
      const lg = fromView(vx, vy);
      const x = lg[0];
      const y = lg[1];

      if (selX >= 0) {
        for (const m of selMoves) {
          if (m[0] === x && m[1] === y) {
            ws.send(JSON.stringify({
              action: 'move',
              from_x: selX, from_y: selY, x: x, y: y
            }));
            clearSel();
            return;
          }
        }
        if (isMyPiece(x, y)) {
          selectPiece(x, y);
          return;
        }
        clearSel();
        return;
      }

      if (isMyPiece(x, y)) {
        selectPiece(x, y);
        return;
      }
      clearSel();
    });


    function showGameOver() {
      if (gameOverShown) return;
      gameOverShown = true;
      stopUndoReplyCountdown();
      stopMoveTimer();

      let text = '';
      if (winner === 'draw') {
        text = '对局结束，双方议和';
        sfxWin();
      } else if (winner === nickname) {
        if (overReason === 'surrender') {
          text = '对手认输，你获胜！';
        } else if (overReason === 'timeout') {
          text = '对手超时，你获胜！';
        } else if (overReason === 'stalemate') {
          text = '对手被困毙，你获胜！';
        } else {
          text = '将死！你获胜！';
        }
        sfxWin();
      } else {
        if (overReason === 'surrender') {
          text = '你已认输';
        } else if (overReason === 'timeout') {
          text = '你已超时判负';
        } else if (overReason === 'stalemate') {
          text = '你被困毙，判负';
        } else {
          text = '被将死，' + winner + ' 获胜';
        }
        sfxLose();
      }

      showModal('游戏结束', text, function () {
        if (wsReady()) ws.send(JSON.stringify({ action: 'reset_game' }));
      }, { force: true });
    }

    // ========== WebSocket ==========
    function connectWebSocket() {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws/game_Cchess/Cchess/room/' + roomId + '/');

      ws.onopen = function () {
        ws.send(JSON.stringify({ action: 'enter' }));
        if (pingTimer) clearInterval(pingTimer);
        pingTimer = setInterval(function () {
          if (wsReady()) ws.send(JSON.stringify({ action: 'ping' }));
        }, 10000);
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(function () {
          if (wsReady()) ws.send(JSON.stringify({ action: 'sync_state' }));
        }, 5000);
      };

      ws.onmessage = function (e) {
        const data = JSON.parse(e.data);
        switch (data.action) {
          case 'room_state':
            applyRoomState(data);
            break;
          case 'player_joined':
            onPlayerJoined(data);
            break;
          case 'ready_update':
            updateReadyUI(data.owner_ready === '1', data.player2_ready === '1');
            if (data.red_player) {
              redPlayer = data.red_player;
              firstMode = data.first_mode || 'owner_red';
              iAmRed = (redPlayer === nickname);
              renderFirstLine();
              refreshNames();
            }
            break;
          case 'opponent_lost':
            if (data.nickname === nickname) break;
            opponentLost = true;
            document.getElementById('waitingText').style.display = 'block';
            document.getElementById('waitingText').textContent = '对手已断线';
            break;
          case 'opponent_reconnected':
            opponentLost = false;
            statusToast = (data.nickname === nickname) ? '你已重新连接' : '对手已重新连接';
            document.getElementById('waitingText').style.display = 'block';
            document.getElementById('waitingText').textContent = statusToast;
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(refreshToastDone, 2000);
            break;
          case 'game_start':
            onGameStart(data);
            break;
          case 'move_made':
            onMoveMade(data);
            break;
          case 'undo_request':
            onUndoRequest(data);
            break;
          case 'undo_done':
            onUndoDone(data);
            break;
          case 'draw_request':
            onDrawRequest(data);
            break;
          case 'draw_rejected':
            onDrawRejected(data);
            break;
          case 'undo_rejected':
            onUndoRejected(data);
            break;
          case 'game_over':
            onGameOver(data);
            break;
          case 'game_reset':
            onGameReset(data);
            break;
          case 'opponent_left':
            onOpponentLeft(data);
            break;
          case 'room_expired':
            showModal('等待超时', data.message || '等待超时，房间已解散', function () {
              window.location.href = '/game_Cchess/Cchess/';
            }, { force: true });
            break;
          case 'room_closed':
            if (selfLeaving) break;
            showModal('房间已解散', data.message, function () {
              window.location.href = '/game_Cchess/Cchess/';
            }, { force: true });
            break;
          case 'error':
            showModal('提示', data.message || '无法进入房间', function () {
              window.location.href = '/game_Cchess/Cchess/';
            }, { force: true });
            break;
        }
        updateActionButtons();
      };

      ws.onclose = function (e) {
        if (pingTimer) clearInterval(pingTimer);
        if (syncTimer) clearInterval(syncTimer);
        if (e && e.code === 4003) return;
        setTimeout(function () {
          if (!document.hidden) connectWebSocket();
        }, 1500);
      };

      ws.onerror = function (e) {
        console.error('WS error', e);
      };
    }

    function applyRoomState(data) {
      ownerName = data.owner || '';
      player2Name = data.player2 || '';
      redPlayer = data.red_player || '';
      firstMode = data.first_mode || 'owner_red';
      iAmRed = (redPlayer === nickname);
      roomStatus = data.status || 'waiting';
      winner = data.winner || '';
      overReason = data.over_reason || '';
      undoPendingBy = data.undo_pending || '';
      undoLocked = isOwner
        ? (data.undo_lock_owner === '1')
        : (data.undo_lock_player2 === '1');
      undoLeft = isOwner
        ? (data.undo_left_owner == null ? 5 : data.undo_left_owner)
        : (data.undo_left_player2 == null ? 5 : data.undo_left_player2);

      loadBoardFromStr(data.board || '');
      setLastFromData(data.last_x, data.last_y);
      setFromFromData(data.last_from_x, data.last_from_y);
      renderBoard();
      updateCheckStatus(true);
      refreshNames();

      const iAmIn = (ownerName === nickname || player2Name === nickname);

      if (roomStatus === 'playing') {
        stopCountdown();
        clearReadyMarkers();
        updatePanels(player2Name, 'playing');
        if (!opponentLost) {
          document.getElementById('waitingText').style.display = 'block';
          setWaitingText('对局进行中');
        }
        renderTurn(ownerName, player2Name, data.current_turn || '');
        applyMoveTimer(data.move_left || 0, data.move_total || 30);
        renderFirstLine();
        if (winner && iAmIn && !overDelayTimer) showGameOver();
        return;
      }

      const prevStatus = roomStatus;
      if (data.ttl && !(countdownTimer && prevStatus === roomStatus)) {
        startCountdown(data.ttl);
      }
      updateReadyUI(data.owner_ready === '1', data.player2_ready === '1');
      updatePanels(player2Name, roomStatus);
      stopMoveTimer();
      renderFirstLine();

      if (player2Name) {
        document.getElementById('waitingText').style.display = 'none';
        renderTurn(ownerName, player2Name, data.current_turn || '');
      } else {
        document.getElementById('waitingText').style.display = 'block';
        if (!opponentLost) {
          document.getElementById('waitingText').textContent = '等待对手加入...';
        }
        document.getElementById('turnInfo').textContent = '-';
      }
    }

    function onPlayerJoined(data) {
      ownerName = data.owner || '';
      player2Name = data.player2 || data.nickname || '';
      redPlayer = data.red_player || '';
      firstMode = data.first_mode || 'owner_red';
      iAmRed = (redPlayer === nickname);
      opponentLost = false;
      roomStatus = 'full';
      winner = '';
      overReason = '';
      gameOverShown = false;
      undoPendingBy = '';
      undoLocked = false;

      initBoard();
      captAnim = null;
      renderBoard();
      stopMoveTimer();
      if (data.ttl) startCountdown(data.ttl);
      updateReadyUI(data.owner_ready === '1', data.player2_ready === '1');
      updatePanels(player2Name, roomStatus);
      refreshNames();
      renderFirstLine();
      sfxJoin();

      if (!statusToast) {
        document.getElementById('waitingText').style.display = 'none';
      }
      renderTurn(ownerName, player2Name, data.current_turn || '');
    }

    function onGameStart(data) {
      document.getElementById('modal').classList.remove('active');
      window._modalCallback = null;
      window._modalCallback2 = null;

      roomStatus = 'playing';
      winner = '';
      overReason = '';
      gameOverShown = false;
      undoPendingBy = '';
      undoLocked = false;
      undoLeft = 5;
      ownerName = data.owner || '';
      player2Name = data.player2 || '';
      redPlayer = data.red_player || '';
      firstMode = data.first_mode || 'owner_red';
      iAmRed = (redPlayer === nickname);

      if (wsReady()) ws.send(JSON.stringify({ action: 'sync_state' }));
      updatePanels(player2Name, 'playing');
      stopCountdown();
      clearReadyMarkers();
      document.getElementById('waitingText').style.display = 'block';
      document.getElementById('waitingText').textContent = '对局开始，红先！';
      refreshNames();
      renderFirstLine();
      renderTurn(ownerName, player2Name, data.current_turn || ownerName);
      applyMoveTimer(data.move_left || 0, data.move_total || 30);
      sfxStart();
    }

    function onMoveMade(data) {
      const fx = parseInt(data.from_x);
      const fy = parseInt(data.from_y);
      const tx = parseInt(data.x);
      const ty = parseInt(data.y);
      const mv = parseInt(data.v);
      board[fx][fy] = 0;
      board[tx][ty] = mv;

      // 走子动画：抬起 → 飞行 → 落下；吃子动画与音效在落地时触发
      const capV = parseInt(data.captured) || 0;
      moveAnim = {
        fx: fx, fy: fy, tx: tx, ty: ty,
        v: mv, capV: capV, srcV: 0, t0: Date.now()
      };
      startMoveAnim();

      setLastFromData(data.last_x, data.last_y);
      setFromFromData(data.last_from_x, data.last_from_y);
      clearSel();

      winner = data.winner || '';
      overReason = data.reason || '';
      updateCheckStatus();
      currentTurn = data.next_turn || '';
      renderTurn(ownerName, player2Name, currentTurn);

      if (winner) {
        stopMoveTimer();
        if (overReason === 'checkmate' || overReason === 'stalemate') {
          pendingOverPrompt = true;
          flushCheckPrompt();
        } else {
          showGameOver();
        }
      } else {
        applyMoveTimer(data.move_left || 0, data.move_total || 30);
      }
    }
    
    function onUndoRejected(data) {
      stopUndoCountdown();
      stopUndoReplyCountdown();
      undoPendingBy = '';

      // 后端 'by' = 点拒绝的人（回应者）
      const by = data.by || '';
      const iAmResponder = (by === nickname);   // 我点的拒绝
      const iAmRequester = !iAmResponder;       // 我申请悔棋被拒
      undoLocked = iAmRequester;                // 只锁请求方本回合

      const msg = iAmRequester
        ? (data.timeout ? '对手未响应，悔棋失败' : '对手拒绝悔棋')
        : '已拒绝悔棋';

      const el = document.getElementById('waitingText');
      if (el) {
        el.style.display = 'block';
        el.textContent = msg;
      }
      if (undoHintTimer) clearTimeout(undoHintTimer);
      undoHintTimer = setTimeout(function () {
        const e = document.getElementById('waitingText');
        if (e) {
          e.style.display = 'none';
          e.textContent = '';
        }
        undoHintTimer = null;
      }, 2500);

      updateUndoBtn();
      renderBoard();
    }
    let undoReplyTimer = null;
    let undoReplyLeft = 0;

    function stopUndoReplyCountdown() {
      if (undoReplyTimer) {
        clearInterval(undoReplyTimer);
        undoReplyTimer = null;
      }
    }

    function startUndoReplyCountdown() {
      stopUndoReplyCountdown();
      undoReplyLeft = 5;
      const modal = document.getElementById('modal');
      const btn2 = document.getElementById('modalBtn2');
      const tick = function () {
        // 弹窗已被关掉（对手反悔或别的流程）→ 停表，别误发拒绝
        if (!modal || !modal.classList.contains('active')) {
          stopUndoReplyCountdown();
          return;
        }
        if (btn2 && btn2.style.display !== 'none') {
          btn2.textContent = '拒绝(' + undoReplyLeft + ')';
        }
        if (undoReplyLeft <= 0) {
          stopUndoReplyCountdown();
          if (btn2 && btn2.style.display !== 'none') btn2.click();
          else if (wsReady()) ws.send(JSON.stringify({ action: 'undo_response', agree: false }));
          return;
        }
        undoReplyLeft -= 1;
      };
      tick();
      undoReplyTimer = setInterval(tick, 1000);
    }
    function onUndoRequest(data) {
      stopUndoReplyCountdown();
      undoPendingBy = data.by || '';

      // 是他自己发起的 → 显示等待倒计时，不弹框
      if (undoPendingBy === nickname) {
        let left = 5;
        const el = document.getElementById('waitingText');
        if (el) {
          el.style.display = 'block';
          el.textContent = '等待对手回应悔棋请求...（' + left + '）';
        }
        undoCountdownTimer = setInterval(function () {
          left -= 1;
          if (left <= 0) {
            stopUndoCountdown();
            if (el) {
              el.style.display = 'none';
              el.textContent = '';
            }
            undoPendingBy = '';
            updateUndoBtn();
            return;
          }
          if (el) el.textContent = '等待对手回应悔棋请求...（' + left + '）';
        }, 1000);
        updateUndoBtn();
        return;
      }

      // 对手发起的 → 弹同意/拒绝框
      showModal('悔棋请求', '对手请求悔棋，是否同意？（5 秒未响应将自动拒绝）', function () {
        stopUndoCountdown();
        if (wsReady()) ws.send(JSON.stringify({ action: 'undo_response', agree: true }));
      }, {
        force: true,
        confirmText: '同意',
        onCancel: function () {
          stopUndoReplyCountdown();
          if (wsReady()) ws.send(JSON.stringify({ action: 'undo_response', agree: false }));
        },
        cancelText: '拒绝'
      });
      startUndoReplyCountdown();
      updateUndoBtn();
    }

    function onUndoDone(data) {
      stopUndoReplyCountdown();
      undoPendingBy = '';
      undoLocked = false;
      const bx = lastX;
      const by = lastY;
      const ax = lastFromX;
      const ay = lastFromY;
      let undoV = 0;
      if (bx >= 0 && by >= 0 && ax >= 0 && ay >= 0) undoV = board[bx][by] || 0;

      if (data.board) loadBoardFromStr(data.board);
      let srcV = 0;
      if (undoV && board[bx] && board[bx][by]) srcV = board[bx][by];

      setLastFromData(data.last_x, data.last_y);
      setFromFromData(data.last_from_x, data.last_from_y);
      currentTurn = data.current_turn || '';
      undoLeft = Math.max(0, undoLeft - 1);
      winner = '';
      overReason = '';
      captAnim = null;
      moveAnim = null;
      clearSel();
      updateCheckStatus(true);
      renderTurn(ownerName, player2Name, currentTurn);
      updateUndoBtn();
      applyMoveTimer(data.move_left || 0, data.move_total || 30);
      sfxPlace();

      // 倒放：最后一手飞回原位
      if (undoV && board[ax] && board[ax][ay] === undoV) {
        moveAnim = { fx: bx, fy: by, tx: ax, ty: ay, v: undoV, capV: 0, srcV: srcV, t0: Date.now() };
        startMoveAnim();
      }
    }
    function onGameOver(data) {
      winner = data.winner || '';
      overReason = data.reason || '';
      undoPendingBy = '';
      currentTurn = '';
      stopUndoReplyCountdown();
      if (undoHintTimer) { clearTimeout(undoHintTime); undoHintTimer = null; }
      stopMoveTimer();
      clearSel();
      captAnim = null;
      showGameOver();
    }

    function onGameReset(data) {
      stopUndoReplyCountdown();
      if (undoHintTimer) { clearTimeout(undoHintTime); undoHintTimer = null; }
      stopMoveTimer();
      winner = '';
      overReason = '';
      gameOverShown = false;
      undoPendingBy = '';
      undoLocked = false;
      undoLeft = 5;
      initBoard();
      clearSel();
      captAnim = null;
      const bt = document.getElementById('boardToast');
      if (bt) bt.classList.remove('show');
      updateCenterText();
      renderBoard();
      clearReadyMarkers();
      updateReadyUI(false, false);
      ownerName = data.owner || '';
      player2Name = data.player2 || '';
      redPlayer = data.red_player || '';
      firstMode = data.first_mode || 'owner_red';
      iAmRed = (redPlayer === nickname);
      roomStatus = data.status || 'waiting';
      updatePanels(player2Name, roomStatus);
      refreshNames();
      renderFirstLine();
      if (data.ttl) startCountdown(data.ttl);
      document.getElementById('waitingText').style.display = 'block';
      document.getElementById('waitingText').textContent = '等待双方准备...';
      renderTurn(ownerName, player2Name, data.current_turn || '');
    }

    function onOpponentLeft(data) {
      stopUndoReplyCountdown();
      stopMoveTimer();
      opponentLost = false;
      roomStatus = 'waiting';
      myReady = false;
      winner = '';
      overReason = '';
      gameOverShown = false;
      undoPendingBy = '';
      undoLocked = false;
      undoLeft = 5;
      initBoard();
      renderBoard();
      clearSel();
      captAnim = null;
      clearReadyMarkers();
      updateReadyUI(false, false);
      updatePanels('', 'waiting');
      redPlayer = ownerName;
      player2Name = '';
      iAmRed = (redPlayer === nickname);
      refreshNames();
      renderFirstLine();
      if (data.ttl) startCountdown(data.ttl);
      document.getElementById('waitingText').style.display = 'block';
      document.getElementById('waitingText').textContent = '对手已离开';
      document.getElementById('turnInfo').textContent = '-';
    }

    // ========== 弹窗 ==========
    function showModal(title, text, onConfirm, opts) {
      opts = opts || {};
      const modal = document.getElementById('modal');
      if (!opts.force && modal.classList.contains('active')) return;

      const btn = document.getElementById('modalBtn');
      const btn2 = document.getElementById('modalBtn2');
      btn.textContent = opts.confirmText || '确定';
      if (opts.onCancel) {
        btn2.style.display = 'inline-block';
        btn2.textContent = opts.cancelText || '取消';
      } else {
        btn2.style.display = 'none';
      }

      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalText').textContent = text;
      modal.classList.add('active');
      window._modalCallback = onConfirm;
      window._modalCallback2 = opts.onCancel || null;
    }

    function handleModalConfirm() {
      stopUndoReplyCountdown();
      document.getElementById('modal').classList.remove('active');
      const cb = window._modalCallback;
      window._modalCallback = null;
      window._modalCallback2 = null;
      sfxClick();
      try {
        if (cb) cb();
      } catch (err) {
        console.error(err);
      }
    }

    function handleModalCancel() {
      stopUndoReplyCountdown();
      document.getElementById('modal').classList.remove('active');
      const cb = window._modalCallback2;
      window._modalCallback = null;
      window._modalCallback2 = null;
      sfxClick();
      try {
        if (cb) cb();
      } catch (err) {
        console.error(err);
      }
    }

    // ========== 初始化 ==========
    (function initSoundBtn() {

    })();

    initBoard();
    resizeBoard();
    updateSafeHintBtn();
    connectWebSocket();

    window.addEventListener('resize', function () {
      clearTimeout(window._resizeTimer);
      window._resizeTimer = setTimeout(resizeBoard, 150);
    });

    if (mqNarrow.addEventListener) {
      mqNarrow.addEventListener('change', function () {
        setTimeout(resizeBoard, 150);
      });
    }

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        if (wsReady()) ws.close();
      } else {
        if (!wsReady()) connectWebSocket();
      }
    });
  </script>

  <script>
    setInterval(function () {
      fetch('/api/check-status/')
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.status === 'kicked') {
            fetch('/game_Cchess/Cchess/force_leave/', { method: 'POST' })
              .finally(function () {
                alert('您已被管理员删除，请重新注册');
                window.location.href = '/';
              });
          }
        })
        .catch(function () {});
    }, 3000);
  </script>
